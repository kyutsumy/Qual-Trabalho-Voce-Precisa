<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - WishWork</title>

    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/ui.css" />
  </head>

  <body>
    <button class="back-btn" onclick="history.back()">←</button>

    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
      🌙
    </button>

    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <div>
            <h1>Bem-vindo</h1>
            <p class="subtitle">
              Entre com seu nome, e-mail e código de acesso
            </p>
          </div>

          <a
            href="/pages/home.html"
            class="site-logo site-logo--box site-logo--center"
            data-site-name
          ></a>
        </div>

        <div class="login-grid">
          <div class="input-group">
            <label>Nome de usuário</label>

            <div class="input-icon">
              <input
                type="text"
                id="username"
                maxlength="20"
                placeholder="Digite seu nome"
              />
              <span id="usernameIcon"></span>
            </div>

            <div id="usernameMsg" class="msg">0/20</div>
          </div>

          <div class="input-group">
            <label>E-mail</label>

            <div class="input-icon">
              <input type="email" id="email" placeholder="Digite seu e-mail" />
              <span id="emailIcon"></span>
            </div>

            <div id="emailMsg" class="msg"></div>
          </div>
        </div>

        <div class="login-bottom-grid">
          <div class="input-group">
            <label>Código</label>

            <div class="code-layout">
              <div class="send-area">
                <button
                  class="send-btn"
                  id="sendBtn"
                  onclick="sendCode()"
                  disabled
                >
                  Enviar código
                </button>

                <div id="timerMsg" class="msg timer-msg"></div>
              </div>

              <div class="code-field-area">
                <div class="input-icon">
                  <input
                    type="text"
                    id="code"
                    maxlength="5"
                    placeholder="A7K2P"
                  />

                  <span id="codeIcon"></span>
                </div>

                <div id="codeMsg" class="msg code-msg"></div>
              </div>
            </div>
          </div>

          <!-- BOTÃO LOGIN -->
          <div class="input-group button-group">
            <label>Acesso</label>

            <button id="loginBtn" class="login-btn" onclick="verify()" disabled>
              Entrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/site-config.js"></script>
    <script src="/assets/site.js"></script>
    <script src="/assets/api-config.js"></script>
    <script src="/js/login.js"></script>
    <script src="/assets/theme.js"></script>
    <script src="/js/ui.js"></script>
  </body>
</html>
