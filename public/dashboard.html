<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <link rel="stylesheet" href="dashboard.css" />
  </head>

  <body>
    <!-- BOTÕES FIXOS -->
    <button class="back-btn" onclick="history.back()">← Voltar</button>

    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
      🌙
    </button>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="index.html" class="logo">WishWork</a>

      <nav>
        <button class="menu-btn active">Dashboard</button>
        <button class="menu-btn">Meus Serviços</button>
        <button class="menu-btn">Perfil</button>
        <button class="menu-btn logout-btn" onclick="logout()">Sair</button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Dashboard</h1>
          <p>Bem-vindo ao WishWork</p>
        </div>

        <div class="profile-box">
          <div class="avatar"></div>

          <div>
            <h3 id="userEmail">carregando...</h3>
            <span>Usuário</span>
          </div>
        </div>
      </div>

      <!-- DASHBOARD -->
      <div class="dashboard">
        <h1>Meu Painel</h1>

        <div class="section">
          <h2>Meus Serviços</h2>
          <div id="myServices"></div>
        </div>

        <div class="section">
          <h2>Pedidos Recebidos</h2>
          <div id="myOrders"></div>
        </div>
      </div>

      <!-- STATS -->
      <section class="stats-grid">
        <div class="stat-card">
          <h2>12</h2>
          <p>Serviços publicados</p>
        </div>

        <div class="stat-card">
          <h2>4</h2>
          <p>Pedidos ativos</p>
        </div>

        <div class="stat-card">
          <h2>98%</h2>
          <p>Avaliação positiva</p>
        </div>
      </section>

      <!-- CONTENT -->
      <section class="content-box">
        <h2>Atividade recente</h2>
        <p>Seu dashboard está funcionando corretamente.</p>
      </section>
    </main>

    <script src="dashboard.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
