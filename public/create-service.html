<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Criar Serviço</title>

    <link rel="stylesheet" href="create-service.css" />
  </head>

  <body>
    <button class="back-btn" onclick="history.back()">← Voltar</button>

    <a href="index.html" class="logo floating-logo"> WishWork </a>

    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
      🌙
    </button>

    <div class="create-container">
      <div class="create-box">
        <h1>Criar Serviço</h1>

        <p class="subtitle">Publique seu serviço no marketplace</p>

        <div class="input-group">
          <label>Título</label>
          <input type="text" id="title" />
        </div>

        <div class="input-group">
          <label>Categoria</label>
          <input type="text" id="category" />
        </div>

        <div class="input-group">
          <label>Preço</label>
          <input type="number" id="price" />
        </div>

        <div class="input-group">
          <label>Descrição</label>
          <textarea id="description"></textarea>
        </div>

        <button class="publish-btn" onclick="createService()">
          Publicar Serviço
        </button>

        <button onclick="orderService('SERVICE_ID', 'PROVIDER_EMAIL')">
          Contratar
        </button>
      </div>
    </div>

    <script src="theme.js"></script>
    <script src="create-service.js"></script>
  </body>
</html>
