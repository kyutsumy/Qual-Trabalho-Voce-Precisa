<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WishWork</title>

  <link rel="stylesheet" href="login.css">
</head>
<button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
  🌙
</button>

<body>

  <button class="back-btn" onclick="history.back()">
    ← Voltar
  </button>
  
  <div class="login-container">

    <div class="login-box">

      <h1>Bem-vindo</h1>
      <p class="subtitle">Entre com seu e-mail e código de acesso</p>

      <!-- EMAIL -->
      <div class="input-group">

        <label>E-mail</label>

        <div class="input-icon">
          <input type="email" id="email" placeholder="Digite seu e-mail">
          <span id="emailIcon"></span>
        </div>

        <!-- MENSAGEM EMAIL -->
        <div id="emailMsg" class="msg"></div>

      </div>

      <!-- CÓDIGO -->
      <div class="input-group">

        <label>Código</label>

        <div class="input-icon code-row">

          <input type="text" id="code" maxlength="5" placeholder="A7K2P">

          <button class="send-btn" id="sendBtn" onclick="sendCode()">
            Enviar código
          </button>

          <span id="codeIcon"></span>

        </div>

        <!-- MENSAGEM CÓDIGO -->
        <div id="codeMsg" class="msg"></div>

      </div>

      <!-- BOTÃO LOGIN -->
      <button id="loginBtn" class="login-btn" onclick="verify()" disabled>
        Entrar
      </button>

    </div>

  </div>

  <script src="login.js"></script>
  <script src="theme.js"></script>

</body>

</html>
